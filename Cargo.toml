[package]
name = "tdx-shim"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause-Patent"
description = "Measured TDX Linux boot stub and deterministic IGVM packager"
build = "build.rs"

[dependencies]
clap = { version = "=4.5.41", features = ["derive"] }
hex = "=0.4.3"
igvm = "=0.3.4"
igvm_defs = "=0.3.4"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
zerocopy = "=0.7.32"

[dev-dependencies]
tempfile = "=3.20.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
