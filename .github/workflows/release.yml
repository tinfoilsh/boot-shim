# Publish the builder, so that anyone handed an expected measurement can fetch
# the thing that computed it, check its digest, and rebuild it themselves.
name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release
  id-token: write # keyless signing
  attestations: write # publish the provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is what a consumer pins, so it has to name the same version the
      # crate reports.
      - name: Check the tag matches the crate version
        run: |
          crate="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$crate" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crate version $crate"
            exit 1
          fi

      - uses: cachix/install-nix-action@v31

      - name: Build
        run: nix-build

      # A release nobody can rebuild to the same bytes would defeat the point
      # of publishing it, so the release fails rather than ships one.
      - name: Rebuild and compare
        run: nix-build --check

      - name: Stage the artifact
        id: artifact
        run: |
          install -m 0755 result/bin/boot-shim boot-shim
          sha256sum boot-shim > boot-shim.sha256
          {
            echo "sha256=$(cut -d' ' -f1 boot-shim.sha256)"
            echo "store=$(readlink -f result)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: boot-shim

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
          STORE: ${{ steps.artifact.outputs.store }}
        run: |
          {
            printf 'Reproducible build of the IGVM builder.\n\n'
            printf '    sha256  %s\n' "$SHA256"
            printf '    store   %s\n\n' "$STORE"
            printf 'Rebuild and compare:\n\n'
            printf '    git clone --branch %s https://github.com/tinfoilsh/boot-shim && cd boot-shim\n' "$GITHUB_REF_NAME"
            printf '    nix-build && sha256sum result/bin/boot-shim\n'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            boot-shim boot-shim.sha256
